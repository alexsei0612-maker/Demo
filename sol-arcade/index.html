const W=450,H=900,C=document.querySelector('#game'),ctx=C.getContext('2d'),launch=document.querySelector('#launch'),hint=document.querySelector('#hint'),meter=document.querySelector('#power'),result=document.querySelector('#result');
const scene=document.querySelector("#scene"),banner=document.querySelector("#banner"),sound=document.querySelector("#sound");let muted=false,audio=null,lastBounce=0,fireworks=[],showTimer=0,burstTimers=[];const R=13, G=760, STEP=1/120, TAU=Math.PI*2;let balls=[],particles=[],rings=[],flashes=[],charging=false,chargeAt=0,aim=225,aimUntil=0,shots=0,won=false,arriving=false,now=0,last=0,acc=0,buttonGlow=0,logoGlow=0,hitCount=0;
const pads=[{a:[98,368],b:[182,380]},{a:[260,419],b:[346,405]},{a:[186,477],b:[270,468]},{a:[82,563],b:[157,588]},{a:[296,588],b:[373,557]}];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const stars=Array.from({length:42},()=>({x:rand(12,438),y:rand(0,900),r:rand(.6,2.1),speed:rand(9,31),phase:rand(0,TAU)}));
// Keep the cabinet static.
banner.style.setProperty('--light-x','50%');
banner.style.setProperty('--light-y','45%');
function audioReady(){if(muted)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{});}catch{}}
function tone(freq,end,dur,vol=.09,type='sine',delay=0){if(muted||!audio||audio.state!=='running')return;let t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+dur);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02);}
function popSound(){tone(110,45,.22,.075,'triangle');tone(1600,320,.1,.035,'triangle');}
function bounceSound(){if(now-lastBounce<80)return;lastBounce=now;tone(530+Math.random()*240,280,.13,.045,'triangle');}
function winSound(){[523,659,784,1047,1319].forEach((f,i)=>{tone(f,f,.32,.055,'triangle',i*.105);tone(f*2,f*1.98,.22,.015,'sine',i*.105);});tone(1047,1047,.65,.045,'sine',.53);}
sound.addEventListener('click',()=>{muted=!muted;sound.textContent=muted?'×':'♫';sound.setAttribute('aria-pressed',String(muted));sound.setAttribute('aria-label',muted?'Activar sonido':'Silenciar sonido');if(!muted){audioReady();tone(600,800,.15,.05);}});
const fireColors=['#fff5b4','#ffc92f','#ff6f29','#ff478c','#ffefdf'];
function firework(x,y,n=65){let c=fireColors[Math.floor(rand(0,fireColors.length))];for(let i=0;i<n;i++){let a=rand(0,TAU),v=rand(55,280),life=rand(.65,1.55);fireworks.push({x,y,px:x,py:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,c:Math.random()<.25?'#fff':c,r:rand(1,2.7)});}ring(x,y,15);popSound();}
function spark(x,y,n=12,force=180){for(let i=0;i<n;i++){let a=rand(0,TAU),s=rand(force*.3,force);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.22,.85),max:.85,r:rand(1,3),color:Math.random()>.35?'#ffdb68':'#fff8cc'});}if(particles.length>220)particles.splice(0,particles.length-220);}
function ring(x,y,r=12){rings.push({x,y,r,life:.45,max:.45});}
function fire(power){if(won||arriving)return;if(balls.length>=7)balls.shift();const target=now<aimUntil?aim:225+[0,-100,100,-135,135][shots%5];const vx=clamp((target-225)*3.7,-390,390);const vy=-(750+power*280);balls.push({x:225,y:680,vx,vy,r:R,trail:[],age:0,guide:false,hits:0});shots++;tone(180,1050,.24,.085,"triangle");buttonGlow=1;spark(225,680,18,190);ring(225,680,16);hint.textContent='TOCA EL CAMPO PARA APUNTAR';}
function start(e){if(won||arriving||charging)return;e.preventDefault();audioReady();charging=true;chargeAt=performance.now();try{launch.setPointerCapture(e.pointerId)}catch{}hint.textContent='SUELTA PARA LANZAR';}
function release(e){if(!charging)return;e.preventDefault();const p=clamp((performance.now()-chargeAt)/800,.57,1);charging=false;meter.style.width='0%';fire(p);}
launch.addEventListener('pointerdown',start);launch.addEventListener('pointerup',release);launch.addEventListener('pointercancel',()=>{charging=false;meter.style.width='0%';});launch.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();if(!won&&!arriving&&!charging){audioReady();charging=true;chargeAt=performance.now();}}});launch.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')release(e)});launch.addEventListener('click',e=>e.preventDefault());
function point(e){let r=C.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}C.addEventListener('pointerdown',e=>{let p=point(e);if(p.y>280&&p.y<690&&!won){aim=clamp(p.x,85,365);aimUntil=performance.now()+3600;hint.textContent='PULSA EL BOTÓN PARA LANZAR';ring(aim,p.y,8);}});
function collide(b,p){const ax=p.a[0],ay=p.a[1],dx=p.b[0]-ax,dy=p.b[1]-ay,t=clamp(((b.x-ax)*dx+(b.y-ay)*dy)/(dx*dx+dy*dy),0,1),qx=ax+t*dx,qy=ay+t*dy;let nx=b.x-qx,ny=b.y-qy,d=Math.hypot(nx,ny),limit=b.r+8;if(d>=limit)return;if(d<.001){nx=0;ny=-1;d=1;}nx/=d;ny/=d;b.x=qx+nx*(limit+.5);b.y=qy+ny*(limit+.5);let v=b.vx*nx+b.vy*ny;if(v<0){b.vx-=1.84*v*nx;b.vy-=1.84*v*ny;b.vx+=rand(-35,35);if(ny<-.35){b.vy=Math.min(b.vy,-460);}else if(b.vy>0){b.vy*=.68;b.vx+=(b.x<225?-1:1)*95;}b.hits++;hitCount++;bounceSound();flashes.push({p,life:.24});spark(qx,qy,9,130);ring(qx,qy,7);}}
function finish(b){arriving=false;won=true;banner.classList.remove('arriving');banner.classList.add('won');balls=[];logoGlow=1;spark(225,50,100,310);ring(225,50,35);hint.textContent='¡OBJETIVO ALCANZADO!';firework(225,55,100);winSound();[[90,180,180],[355,210,350],[225,340,540],[80,440,750],[365,475,930],[225,165,1160]].forEach(([x,y,d])=>burstTimers.push(setTimeout(()=>{if(won)firework(x,y,72)},d)));showTimer=setTimeout(()=>{if(won)result.hidden=false;},1700);}
function update(dt){buttonGlow=Math.max(0,buttonGlow-dt*2);logoGlow=Math.max(0,logoGlow-dt*.3);for(let b of balls){b.age+=dt;if(b.guide){b.guideT+=dt;let t=clamp(b.guideT/.65,0,1),s=1-(1-t)**2;b.x=b.fromX+(225-b.fromX)*s+Math.sin(t*Math.PI)*28;b.y=b.fromY+(55-b.fromY)*s;if(t===1){finish(b);break;}}else{b.vy+=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;const left=79+(690-b.y)*.035,right=371-(690-b.y)*.035;if(b.x-b.r<left){b.x=left+b.r;b.vx=Math.abs(b.vx)*.9;spark(b.x-b.r,b.y,5,80);}if(b.x+b.r>right){b.x=right-b.r;b.vx=-Math.abs(b.vx)*.9;spark(b.x+b.r,b.y,5,80);}for(const p of pads)collide(b,p);if(b.y<294&&!arriving){b.guide=true;b.guideT=0;b.fromX=b.x;b.fromY=b.y;arriving=true;banner.classList.add("arriving");tone(400,1300,.5,.065,"sine");logoGlow=.7;spark(b.x,b.y,24,200);hint.textContent='VAMOS!';}else if(b.y<290){b.y=290;b.vy=Math.abs(b.vy)*.8;}}
if(Math.random()<.8){b.trail.push({x:b.x,y:b.y});if(b.trail.length>18)b.trail.shift();}}
if(!won){let old=balls.length;balls=balls.filter(b=>b.y<720&&b.age<12);if(old&&!balls.length&&!arriving&&!charging)hint.textContent='INTÉNTALO DE NUEVO';}
for(let f of fireworks){f.px=f.x;f.py=f.y;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.exp(-1.3*dt);f.vy=f.vy*Math.exp(-1.3*dt)+145*dt;f.life-=dt;}fireworks=fireworks.filter(f=>f.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);for(let r of rings){r.life-=dt;r.r+=95*dt;}rings=rings.filter(r=>r.life>0);for(let f of flashes)f.life-=dt;flashes=flashes.filter(f=>f.life>0);}
function glow(x,y,r,col,alpha){ctx.save();ctx.globalAlpha=alpha;let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'#ff9b0000');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
function drawBall(b){if(b.trail.length>1){ctx.save();ctx.lineCap='round';for(let i=1;i<b.trail.length;i++){let a=b.trail[i-1],z=b.trail[i],t=i/b.trail.length;ctx.globalAlpha=t*t*.47;ctx.strokeStyle='#ffae28';ctx.lineWidth=t*15;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(z.x,z.y);ctx.stroke();ctx.globalAlpha=t*t*.8;ctx.strokeStyle='#fff3aa';ctx.lineWidth=t*3;ctx.stroke();}ctx.restore();}glow(b.x,b.y,40,'#ffb32a',.58);let g=ctx.createRadialGradient(b.x-5,b.y-7,1,b.x,b.y,R+1);g.addColorStop(0,'#fffde1');g.addColorStop(.24,'#ffe577');g.addColorStop(.53,'#ffad0a');g.addColorStop(.76,'#ef4e02');g.addColorStop(.92,'#ffbd30');g.addColorStop(1,'#fff5b4');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,R,0,TAU);ctx.fill();ctx.strokeStyle='#ffe9a7';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='#fffce7';ctx.beginPath();ctx.ellipse(b.x-5,b.y-7,4.7,2.4,-.55,0,TAU);ctx.fill();}
function render(t){ctx.setTransform(C.width/W,0,0,C.height/H,0,0);ctx.clearRect(0,0,W,H);const s=t/1000;ctx.save();ctx.globalCompositeOperation='screen';for(const p of stars){let y=(p.y+s*p.speed)%900,alpha=(.14+.26*(1+Math.sin(s*1.6+p.phase))/2);ctx.fillStyle=`rgba(255,215,145,${alpha})`;ctx.beginPath();ctx.arc(p.x,y,p.r,0,TAU);ctx.fill();}for(let i=0;i<8;i++){let y=325+i*41.7,op=.16+.25*(1+Math.sin(s*3-i*.8))/2;glow(63-i*2.7,y,21,'#ffd56b',op);glow(386+i*2.1,y,21,'#ffd56b',op);}glow(225,300,65,'#ffbb36',.14+.12*Math.sin(s*3));glow(225,765,88,'#ffb929',.13+.13*(1+Math.sin(s*3.2))/2+buttonGlow*.48);if(logoGlow>0)glow(225,48,145,'#ffd44a',logoGlow*.55);for(let f of flashes){ctx.globalAlpha=f.life/.24;ctx.lineWidth=12;ctx.lineCap='round';ctx.strokeStyle='#ffbf58';ctx.beginPath();ctx.moveTo(...f.p.a);ctx.lineTo(...f.p.b);ctx.stroke();ctx.globalAlpha=1;}ctx.restore();
if(aimUntil>t&&!won&&!arriving){ctx.save();ctx.strokeStyle='#fff4a8aa';ctx.lineWidth=2;ctx.setLineDash([4,8]);ctx.beginPath();ctx.moveTo(225,672);ctx.quadraticCurveTo(225+(aim-225)*.5,550,aim,440);ctx.stroke();ctx.restore();}
if(charging){let p=clamp((t-chargeAt)/800,0,1);meter.style.width=(p*100)+'%';glow(225,685,65+25*p,'#ffdb50',.15+p*.3);}
for(let b of balls)drawBall(b);ctx.save();ctx.globalCompositeOperation="lighter";ctx.lineCap="round";for(let f of fireworks){let alpha=clamp(f.life/f.max,0,1);ctx.globalAlpha=alpha;ctx.strokeStyle=f.c;ctx.lineWidth=f.r;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x-f.vx*.065,f.y-f.vy*.065);ctx.stroke();ctx.fillStyle="#fff7c0";ctx.beginPath();ctx.arc(f.x,f.y,f.r*.6,0,TAU);ctx.fill();}ctx.restore();ctx.save();ctx.globalCompositeOperation='lighter';for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}for(let r of rings){ctx.globalAlpha=r.life/r.max*.75;ctx.strokeStyle='#ffe3a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();}ctx.restore();}
function tick(t){now=t;let dt=last?Math.min((t-last)/1000,.05):0;last=t;acc+=dt;while(acc>=STEP){update(STEP);acc-=STEP;}render(t);requestAnimationFrame(tick);}document.querySelector('#again').addEventListener('click',()=>{won=false;arriving=false;banner.classList.remove("won","arriving");clearTimeout(showTimer);burstTimers.forEach(clearTimeout);burstTimers=[];shots=0;balls=[];particles=[];rings=[];flashes=[];fireworks=[];result.hidden=true;hint.textContent='MANTÉN PULSADO PARA LANZAR';});requestAnimationFrame(tick);
})();
