(function(){'use strict';

drawCount(Math.round(countValue));}
function rand(a,b){return a+Math.random()*(b-a)}
function drawCount(n){number=Math.max(0,Math.min(100,n));if(!ready||number===lastNum)return;lastNum=number;document.getElementById('counter').setAttribute('aria-label','Boost de bienvenida +'+number+'%');counter.clearRect(0,0,320,94);var s='+'+number+'%',chars='0123456789+%',widths=[55,55,55,55,55,55,55,55,55,55,54,75],total=0;for(var i=0;i<s.length;i++)total+=widths[chars.indexOf(s[i])];var x=(320-total)/2;for(var j=0;j<s.length;j++){var k=chars.indexOf(s[j]),w=widths[k];counter.drawImage(atlas,k*80,0,80,94,x+(w-80)/2,0,80,94);x+=w;}patch.classList.toggle('done',number===100);}
