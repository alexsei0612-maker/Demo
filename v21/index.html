'use strict';

function createIce(surface) {
  const layer=document.createElement('canvas');
  layer.width=layer.height=480;
  const gl=layer.getContext('webgl',{alpha:true,premultipliedAlpha:true,preserveDrawingBuffer:true,antialias:false});
  if(!gl) return null;
  gl.clearColor(0,0,0,0);
  const vertex=`
    attribute vec2 position;
    varying vec2 uv;
    void main(){uv=position;gl_Position=vec4(position,0.,1.);}
  `;
  const fragment=`
    precision highp float;
    varying vec2 uv;
    uniform vec2 orientation;
    uniform float solarRadius;
    uniform float phase;
    uniform float damage;
    uniform float impact;
    uniform sampler2D solar;
    uniform sampler2D brand;

    float hash(vec3 p){
      return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);
    }
    float noise(vec3 p){
      vec3 i=floor(p),f=fract(p);
      f=f*f*(3.-2.*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),
                     mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                     mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);
    }
    vec3 local(vec3 p){
      float a=orientation.x,b=orientation.y;
      float y=p.y*cos(b)+p.z*sin(b);
      float z=p.z*cos(b)-p.y*sin(b);
      return vec3(p.x*cos(a)-z*sin(a),y,z*cos(a)+p.x*sin(a));
    }
    float shell(vec3 p){
      vec3 q=abs(p)-vec3(.88);
      return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-.114
        +(noise(p*8.)-.5)*.028+(noise(p*23.)-.5)*.009;
    }
    vec3 normal(vec3 p){
      vec2 e=vec2(.004,0.);
      vec3 g=vec3(shell(p+e.xyy)-shell(p-e.xyy),
        shell(p+e.yxy)-shell(p-e.yxy),shell(p+e.yyx)-shell(p-e.yyx));
      float len=length(g);
      return len>.00001?g/len:vec3(0.,0.,1.);
    }
    vec3 lightThrough(vec3 p,vec3 ray,vec3 right,vec3 down,float radius){
      vec3 closest=p+max(0.,-dot(p,ray))*ray;
      float d=length(closest);
      vec2 st=.5+vec2(dot(closest,right),dot(closest,down))*.49/radius;
      float angle=phase*.09;
      st=.5+mat2(cos(angle),-sin(angle),sin(angle),cos(angle))*(st-.5);
      vec3 image=texture2D(solar,clamp(st,0.,1.)).rgb;
      float corona=exp(-max(0.,d-radius)*12.)*(1.-smoothstep(radius*.8,radius*1.7,d));
      return image*(1.-smoothstep(radius*.91,radius,d))*(.30+min(damage,3.)*.105) +
        vec3(1.,.32,.032)*corona*.41;
    }
    // Each sheet opens inside the ice and tapers away from the impact.
    vec2 fissure(vec3 p,vec3 ray,vec3 origin,vec3 along,vec3 across,float span,float twist){
      vec3 n=normalize(cross(along,across));
      float facing=dot(ray,n);
      float t=dot(origin-p,n)/(abs(facing)<.01?.01:facing);
      vec3 hit=p+t*ray-origin;
      float u=dot(hit,along);
      float v=dot(hit,across);
      float limit=abs(u)/span;
      float envelope=(1.-smoothstep(.57,1.,limit))*step(-.018,t)*step(t,.98);
      float kink=(noise(vec3(u*11.,twist,0.))-.5)*.17
        +(noise(vec3(u*43.,twist,1.))-.5)*.044;
      float seam=v-kink;
      float width=.006+.017*envelope;
      float hollow=(1.-smoothstep(width,width+.014,abs(seam)))*envelope;
      float glint=(1.-smoothstep(.004,.021,abs(seam-width*.83)))*envelope;
      return vec2(hollow,glint*(.38+.62*abs(facing)));
    }
    void main(){
      vec3 eye=local(vec3(0,0,4.6));
      vec3 ray=normalize(local(vec3(uv.x*1.9,-uv.y*1.9,-4.6)));
      vec3 safeRay=vec3(abs(ray.x)<.000001?.000001:ray.x,abs(ray.y)<.000001?.000001:ray.y,abs(ray.z)<.000001?.000001:ray.z);
      vec3 t0=(-vec3(1.035)-eye)/safeRay,t1=(vec3(1.035)-eye)/safeRay;
      vec3 nearPlane=min(t0,t1),farPlane=max(t0,t1);
      float t=max(max(nearPlane.x,nearPlane.y),nearPlane.z);
      float end=min(min(farPlane.x,farPlane.y),farPlane.z);
      if(t>end) discard;
      float d=1.;
      for(int i=0;i<26;i++){
        d=shell(eye+t*ray);
        if(d<.003||t>end) break;
        t+=d*.70;
      }
      if(d>.006||t>end) discard;
      vec3 p=eye+t*ray,n=normal(p);
      float face=clamp(dot(-ray,n),0.,1.);
      float invFace=1.-face;
      float invFace2=invFace*invFace;
      float fresnel=.026+.974*invFace2*invFace2;
      vec3 nHit=dot(ray,n)>0.?-n:n;
      vec3 refr=refract(ray,nHit,1./1.31);
      vec3 inside=dot(refr,refr)>.0001?normalize(refr):ray;
      vec3 right=local(vec3(1,0,0)),down=local(vec3(0,1,0));
      vec3 axes=abs(p);
      float seam=axes.x+axes.y+axes.z-max(axes.x,max(axes.y,axes.z))-min(axes.x,min(axes.y,axes.z));
      float rim=smoothstep(.70,1.0,seam);
      float grain=noise(p*41.);
      float vBase=max(0.,1.-abs(sin((p.y*2.6+noise(p*5.)*.72)*23.)));
      float v2=vBase*vBase;
      float veins=v2*v2*v2;
      float snow=smoothstep(.56,.87,noise(p*18.)*.72+grain*.28)*rim;
      vec3 entryLight=lightThrough(p,inside,right,down,solarRadius);
      vec3 exitT=(sign(inside)*.975-p)/mix(vec3(.0001),inside,step(vec3(.0001),abs(inside)));
      exitT=mix(vec3(10.),exitT,step(vec3(.02),exitT));
      float travel=min(min(exitT.x,exitT.y),exitT.z);
      vec3 exitPoint=p+inside*travel;
      vec3 exitNormal=step(exitT,vec3(travel+.001))*sign(inside);
      vec3 rebound=reflect(inside,exitNormal);
      vec3 reflectedLight=lightThrough(exitPoint,rebound,right,down,solarRadius*1.11);
      float bubbles=smoothstep(.77,.96,noise(p*72.+inside*4.));
      vec3 blue=vec3(.055,.40,.78);
      float faceFill=(1.-rim)*(.18+.09*smoothstep(.15,.95,face))*(.78+.22*noise(p*12.));
      vec3 color=blue*(.15+.39*noise(p*8.)+.24*veins*rim)

    ctx.restore();
  }
}
function snowLayer(t,foreground) {
  ctx.save();
  for(const [u,v,depth,drift] of snow) {
    if((depth>.73)!==foreground) continue;
    const x=((u+t*(.021+depth*.021)+Math.sin(t*.7+drift*28)*.016+1)%1)*width;
    ctx.globalAlpha=edgeOpacity(x);
    const y=((v+t*(.028+depth*.06))%1)*height;
    const r=width*(.00055+depth**3*.004);
    ctx.fillStyle=`rgba(216,241,255,${.16+drift*.56})`;
    if(foreground) {
      glow(x,y,r*2.1,[[0,`rgba(221,247,255,${.28+drift*.47})`],[1,'transparent']]);
    } else {
      ctx.beginPath();ctx.arc(x,y,r,0,tau);ctx.fill();
    }

  ctx.restore();
}
function draw(time) {
  const still=reduced.matches, t=still?0:time;
  const dt=Math.min(.05,Math.max(0,time-previousFrame));
  previousFrame=time;
  if(!still && !gesture) {
    const drag=Math.exp(-dt*1.65);
    const distance=(1-drag)/1.65;
    orbit+=dt*.16+yawSpeed*distance;
    tilt+=pitchSpeed*distance;
    yawSpeed*=drag;
    pitchSpeed*=drag;
  }
  const age=Math.max(0,time-lastHit);
  const open=count===4?1:0;
  const release=open*(still?1:1-Math.exp(-age*3.5));
  const impact=still?0:Math.exp(-age*8);
  const pulse=still?0:Math.pow(.5+.5*Math.sin(t*2.8),3)*(1-release);
  const cheer=open&&!still?release*Math.exp(-age*1.65):0;
  const hop=cheer*Math.abs(Math.sin(age*7.2));
  const flare=open?(still?.62:.52+.38*Math.sin(age*3.3)**2):0;
  const struggle=pulse*Math.sin(t*26);
  const x=cx+scale*(Math.sin(age*49)*impact*.078+struggle*.038+cheer*Math.sin(age*8)*.13);
  const y=cy+scale*(-release*.17+Math.sin(t*1.5)*.023-pulse*.046-hop*.68);
  const radius=scale*(.57+release*.59+pulse*.14+hop*.19);
  ctx.clearRect(0,0,width,height);
  winter(t,release,pulse);
  ctx.globalCompositeOperation='screen';
  glow(x,y,scale*(3.5+pulse*.55+flare*.42),[[0,`rgba(255,162,58,${.13+release*.26+pulse*.32+flare*.09})`],[.58,'rgba(185,63,24,.08)'],[1,'transparent']]);
  ctx.save();
  ctx.translate(x,cy+scale*1.42);
  ctx.scale(1,.15);
  glow(0,0,scale*2.6,[[0,`rgba(149,217,255,${.42-release*.14})`],[.45,'rgba(84,162,212,.16)'],[1,'transparent']]);
  ctx.restore();
  const lightLeak=(.19+Math.min(count,3)*.035+pulse*.12)*(1-release);
  for(const [angle,length,spread,short] of rayAngles) {
    const a=angle+t*.020;
    const flicker=.76+.24*Math.cos(t*3.2+angle*25);
    const strength=(lightLeak+release*(.43+flare*.27))*flicker;
    const start=radius*(.91+spread*.06);

      ? radius*(1.08+length*.35+release*.06)
      : radius*(2.2+length**2*3.4+release*(.24+length*1.9));
    const distance=start+(originalDistance-start)*.70;
    const dx=Math.cos(a),dy=Math.sin(a);
    const sx=x+dx*start,sy=y+dy*start;
    const ex=x+dx*distance,ey=y+dy*distance;
    const beam=ctx.createLinearGradient(sx,sy,ex,ey);
    beam.addColorStop(0,`rgba(255,250,192,${strength})`);
    beam.addColorStop(.22,`rgba(255,181,47,${strength*.61})`);
    beam.addColorStop(.59,`rgba(255,139,28,${strength*.27})`);
    beam.addColorStop(1,'rgba(255,67,10,0)');
    const thickness=radius*(.004+spread*.015)*(short?2.2:1);
    ctx.fillStyle=beam;
    ctx.globalAlpha=.35;

      [sx+dy*thickness*3,sy-dx*thickness*3]],true);

  }
  glow(x,y,radius*1.48,[[.57,'transparent'],[.66,`rgba(255,229,138,${release*.64})`],
    [.74,`rgba(255,143,23,${release*.28})`],[1,'transparent']]);
  ctx.globalCompositeOperation='source-over';

  const yaw=orbit+struggle*.048, pitch=tilt+Math.sin(t*.62)*.065+struggle*.021;
  const sinYaw=Math.sin(yaw), cosYaw=Math.cos(yaw);
  const sinPitch=Math.sin(pitch), cosPitch=Math.cos(pitch);
  function project([vx,vy,vz]) {
    const xx=vx*cosYaw+vz*sinYaw, zz=vz*cosYaw-vx*sinYaw;
    const yy=vy*cosPitch-zz*sinPitch, depth=zz*cosPitch+vy*sinPitch;
    const f=4.6/(4.6-depth)*scale;

  }
  const cubes=faces.map((face,id)=>{
    const corners=face.map(i=>vertices[i]), points=corners.map(project);
    const depth=points.reduce((sum,p)=>sum+p[2],0)/4;
    return {corners,points,depth,id};
  }).sort((a,b)=>a.depth-b.depth);
  const iceAlpha=(1-release)**2;
  const iceVisible=iceAlpha>=.004 && Boolean(ice?.render(yaw,pitch,radius/scale,t,count,impact));
  const fallbackIce=!iceVisible && iceAlpha>=.004;
  function surfaceCracks() {
    if(iceAlpha<.004) return;
    const visible=cubes.filter(face=>face.depth>.24).sort((a,b)=>b.depth-a.depth);
    visible.slice(0,2).forEach(({corners},faceIndex)=>{
      const [a,b,,d]=corners;
      const inset=.062;
      const onFace=(u,v)=>project(a.map((n,i)=>n+(b[i]-n)*u+(d[i]-n)*v));
      ctx.save();
      ctx.globalAlpha=iceAlpha*(faceIndex===0?1:.66);
      path([[inset,inset],[1-inset,inset],[1-inset,1-inset],[inset,1-inset]]
        .map(([u,v])=>onFace(u,v)),true);
      ctx.clip();
      ctx.lineJoin='round';
      ctx.lineCap='round';
      for(let level=faceIndex;level<Math.min(count,3);level++) {
        fracture[level].forEach((line,index)=>{
          const points=line.map(([u,v])=>onFace(faceIndex?1-u:u,v));
          path(points);
          ctx.lineWidth=scale*(index%3===0?.032:.019);
          ctx.strokeStyle='rgba(19,13,16,.58)';
          ctx.stroke();
          ctx.lineWidth=scale*(index%3===0?.014:.008);
          ctx.strokeStyle=`rgba(229,248,255,${(index%3===0?.70:.47)+impact*.20})`;
          ctx.stroke();
        });
      }
      ctx.restore();
    });
  }
  function glass({corners,points,depth,id}) {
    if(iceAlpha<.004) return;
    ctx.save();
    ctx.globalAlpha=iceAlpha;
    const [a,b,,d]=corners;
    const onFace=(u,v,shrink=1)=>project(a.map((n,i)=>(n+(b[i]-n)*u+(d[i]-n)*v)*shrink));
    path(points,true);
    ctx.clip();
    const reflection=ctx.createLinearGradient(x-scale,y-scale,x+scale,y+scale);
    reflection.addColorStop(0,'rgba(208,246,255,.49)');
    reflection.addColorStop(.29,'rgba(162,215,241,.32)');
    reflection.addColorStop(.48,'rgba(179,232,255,.28)');
    reflection.addColorStop(.58,'rgba(145,203,240,.30)');
    reflection.addColorStop(.81,'rgba(97,165,219,.21)');
    reflection.addColorStop(1,'rgba(199,247,255,.44)');
    ctx.fillStyle=reflection;ctx.fillRect(x-2*scale,y-2*scale,4*scale,4*scale);
    path([[0,.05],[1,.23],[1,.31],[0,.1]].map(([u,v])=>onFace(u,v)),true);
    ctx.fillStyle=`rgba(217,233,255,${.045+Math.max(0,depth)*.075})`;ctx.fill();
    for(const [u,v,grain,variation] of frost) {
      const [px,py]=onFace(u,v);
      const flake=scale*(.003+grain**3*.02);
      ctx.fillStyle=`rgba(208,245,255,${.065+variation*.34})`;
      ctx.beginPath();ctx.ellipse(px,py,flake,flake*(.35+variation*.57),id*.85,0,tau);ctx.fill();
    }
    for(let layer=0;layer<3;layer++) {
      const inset=.028+layer*.024;
      path([[inset,inset],[1-inset,inset],[1-inset,1-inset],[inset,1-inset]]
        .map(([u,v])=>onFace(u,v)),true);
      ctx.lineWidth=scale*(.044-layer*.008);
      ctx.strokeStyle=`rgba(184,237,255,${.14-layer*.036})`;ctx.stroke();
    }
    if(count>0&&depth>0) {
      ctx.lineJoin='round';
      for(let level=0;level<Math.min(count,3);level++) {
        if(level>0 && (id+level)%4===0) continue;
        for(const line of fracture[level]) {
          path(line.map(([u,v])=>onFace(u,v)));
          ctx.lineWidth=scale*.033;ctx.strokeStyle='rgba(7,33,60,.72)';ctx.stroke();
          ctx.lineWidth=scale*(level===0?.013:.008);ctx.strokeStyle=`rgba(217,248,255,${.68+impact*.28})`;ctx.stroke();
        }
      }
    }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha=iceAlpha;
    const edge=ctx.createLinearGradient(x-scale,y-scale,x+scale,y+scale);
    edge.addColorStop(0,'#d8faff');edge.addColorStop(.44,'#557da4');
    edge.addColorStop(.7,'#eefbff');edge.addColorStop(1,'#6cbfe4');
    path(points,true);ctx.lineWidth=scale*(depth>0?.062:.038);ctx.strokeStyle='rgba(141,217,250,.28)';ctx.stroke();
    ctx.lineWidth=scale*(depth>0?.018:.009);ctx.strokeStyle=edge;ctx.stroke();
    path([[.028,.028],[.972,.028],[.972,.972],[.028,.972]].map(([u,v])=>onFace(u,v,.993)),true);
    ctx.lineWidth=.75;ctx.strokeStyle='rgba(225,212,206,.46)';ctx.stroke();
    ctx.restore();
  }
  if(fallbackIce) cubes.filter(face=>face.depth<=0).forEach(face=>glass(face));

  ctx.globalCompositeOperation='screen';
  glow(x,y,radius*1.7,[[.48,'rgba(255,121,11,.32)'],[.59,'rgba(255,80,12,.38)'],[.72,'rgba(255,61,6,.14)'],[1,'transparent']]);
  ctx.globalCompositeOperation='source-over';
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(t*.057);
  ctx.globalAlpha=iceVisible?release:1;
  ctx.drawImage(texture,-radius,-radius,radius*2,radius*2);
  ctx.restore();
  ctx.globalCompositeOperation='screen';
  ctx.save();
  ctx.globalAlpha=.28+release*.72;
  ctx.lineCap='round';
  for(let i=0;i<22;i++){
    const angle=i*tau/22+Math.sin(i*14.5)*.12+t*.13;
    const wave=.5+.5*Math.sin(t*2.2+i*3.7);
    const span=.065+.20*(.5+.5*Math.sin(i*11.3));
    const rise=(.025+wave*.11)*(i%4===0?1.55:1);

    for(let step=0;step<=20;step++){
      const u=step/20;
      const envelope=Math.sin(Math.PI*u);
      const a=angle+(u-.5)*span;

      const r=radius*(.966+envelope*(rise+distortion));
      const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;
      if(step===0) ctx.moveTo(px,py);

    ctx.lineWidth=radius*.078;
    ctx.strokeStyle=`rgba(255,119,12,${.14+wave*.16})`;
    ctx.stroke();
    ctx.lineWidth=radius*.022;
    ctx.strokeStyle=`rgba(255,216,112,${.36+wave*.34})`;
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
  if(iceVisible) {
    const half=scale*1.9;
    ctx.save();
    ctx.globalCompositeOperation='screen';
    glow(x,y,scale*1.65,[[0,`rgba(170,232,255,${iceAlpha*.22})`],[.6,`rgba(120,205,255,${iceAlpha*.09})`],[1,'transparent']]);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=iceAlpha;
    ctx.drawImage(ice.layer,x-half,y-half,half*2,half*2);
    ctx.restore();
    if(count) surfaceCracks();

    cubes.filter(face=>face.depth>0).forEach(face=>glass(face));
  }
  if(logo.complete && logo.naturalWidth && (open || !iceVisible)) {
    const logoWidth=radius*(open?1.72:1.39);
    const logoHeight=logoWidth*logo.naturalHeight/logo.naturalWidth;
    ctx.save();
    ctx.globalAlpha=open?release:.22+count*.18;
    if(open) {
      ctx.save();
      ctx.translate(x,y);
      ctx.scale(1,.72);
      glow(0,0,radius*.98,[[0,'rgba(45,8,2,.87)'],[.63,'rgba(49,9,2,.78)'],[1,'transparent']]);
      ctx.restore();
    }
    ctx.shadowColor='#300702';
    ctx.shadowBlur=radius*.18;
    ctx.translate(x,y);
    ctx.rotate(cheer*Math.sin(age*10)*.25);
    if(open && logoOutline.width>300){
      const padding=logoWidth*8/384;
      ctx.save();
      ctx.globalAlpha=release;
      ctx.shadowColor='#ffce56';
      ctx.shadowBlur=radius*.20;
      ctx.drawImage(logoOutline,-logoWidth/2-padding,-logoHeight/2-padding,
        logoWidth+2*padding,logoHeight+2*padding);
      ctx.shadowColor='#fff0ba';
      ctx.shadowBlur=radius*.06;
      ctx.drawImage(logoOutline,-logoWidth/2-padding,-logoHeight/2-padding,
        logoWidth+2*padding,logoHeight+2*padding);
      ctx.restore();
      ctx.shadowBlur=0;

    const ribbons=['#ffda57','#a4ff52','#ff6547','#b6f8ff'];
    shards.slice(0,44).forEach(([angle,s,p,q,k],index)=>{
      const elapsed=age-q*.24;
      if(elapsed<0 || elapsed>2.2) return;
      const distance=scale*(.84+(1-Math.exp(-elapsed*1.5))*(.64+s*2.14));
      const px=cx+Math.cos(angle)*distance;
      const py=cy+Math.sin(angle)*distance+scale*(elapsed*elapsed*.36-elapsed*.54);
      const size=scale*(.025+p*.038);
      const ribbonAlpha=Math.min(1,elapsed*18,(2.2-elapsed)*1.6);

      ctx.translate(px,py);

      ctx.fillStyle=ribbons[index%ribbons.length];
      ctx.fillRect(-size/2,-size*.19,size,size*(.26+.28*Math.abs(Math.cos(elapsed*8+q*5))));

    });
    for(const [a,s,p,q,k] of shards) {
      const distance=scale*(.85+age*(1+s*3));
      const px=x+Math.cos(a)*distance, py=y+Math.sin(a)*distance+age*age*24;
      const size=scale*(.025+p*.16), alpha=Math.max(0,1-age/2.5);
      if(alpha<.004) continue;
      ctx.save();
      ctx.translate(px,py);ctx.rotate(q*9+age*(k-.5)*15);
      ctx.globalAlpha=alpha;
      path([[-size,-size*.4],[size,0],[size*.2,size*.71]],true);
      ctx.fillStyle='rgba(167,225,255,.35)';ctx.fill();
      ctx.lineWidth=scale*.007;ctx.strokeStyle=k>.5?'#ffe2af':'#b5efff';ctx.stroke();
      ctx.restore();
    }
  }
  if(impact>.03) {
    ctx.globalCompositeOperation='screen';
    glow(x,y,scale*(open?3.8:2),[[0,`rgba(255,233,188,${impact*(open?.9:.26)})`],[1,'transparent']]);
    ctx.globalCompositeOperation='source-over';
  }
  snowLayer(t,true);
  requestAnimationFrame(()=>draw(now()));
}

draw(0);
